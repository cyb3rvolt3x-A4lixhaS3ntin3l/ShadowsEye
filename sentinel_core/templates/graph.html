{% extends "base.html" %}
{% block title %}Graph View - Sentinel Core{% endblock %}
{% block header_title %}Entity Graph{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3 class="card-title"><i class="fas fa-project-diagram"></i> Entity Relationship Graph</h3>
        <a href="{{ url_for('view_case', case_id=case_id) }}" class="btn btn-secondary btn-sm">Back to Case</a>
    </div>
    <div class="graph-container" id="graphContainer">
        <canvas id="graphCanvas" style="width: 100%; height: 100%;"></canvas>
    </div>
    <div style="margin-top: 16px; display: flex; gap: 16px; flex-wrap: wrap;">
        <div><span class="badge entity-type-domain">●</span> Domain</div>
        <div><span class="badge entity-type-ip">●</span> IP</div>
        <div><span class="badge entity-type-email">●</span> Email</div>
        <div><span class="badge entity-type-url">●</span> URL</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const nodes = {{ nodes | tojson }};
const links = {{ links | tojson }};

// Simple force-directed visualization
const container = document.getElementById('graphContainer');
const canvas = document.getElementById('graphCanvas');
const ctx = canvas.getContext('2d');

canvas.width = container.clientWidth;
canvas.height = container.clientHeight;

const nodePositions = {};
nodes.forEach((node, i) => {
    nodePositions[node.id] = {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: 0,
        vy: 0
    };
});

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw links
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    links.forEach(link => {
        const source = nodePositions[link.source];
        const target = nodePositions[link.target];
        if (source && target) {
            ctx.beginPath();
            ctx.moveTo(source.x, source.y);
            ctx.lineTo(target.x, target.y);
            ctx.stroke();
        }
    });
    
    // Draw nodes
    nodes.forEach(node => {
        const pos = nodePositions[node.id];
        const colors = {
            'domain': '#00f0ff',
            'ip': '#00ff88',
            'email': '#bd00ff',
            'url': '#ff8800',
            'hash': '#ff0055'
        };
        
        ctx.fillStyle = colors[node.type] || '#ffffff';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#ffffff';
        ctx.font = '12px Inter';
        ctx.fillText(node.label.substring(0, 20), pos.x + 12, pos.y);
    });
    
    requestAnimationFrame(draw);
}

draw();
</script>
{% endblock %}
