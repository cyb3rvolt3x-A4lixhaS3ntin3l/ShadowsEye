<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graph - {{ case.name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f23; color: #fff; min-height: 100vh; }
        .navbar { background: rgba(0,0,0,0.5); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,217,255,0.2); }
        .navbar h1 { color: #00d9ff; font-size: 24px; }
        .nav-links a { color: #888; text-decoration: none; margin-left: 20px; }
        .nav-links a:hover { color: #00d9ff; }
        #graph { height: calc(100vh - 60px); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/vis-network.min.js"></script>
</head>
<body>
    <div class="navbar">
        <h1>🛡️ Sentinel Core</h1>
        <div class="nav-links">
            <a href="{{ url_for('case_detail', case_id=case.id) }}">Back to Case</a>
            <a href="{{ url_for('logout') }}" style="color: #ff4444;">Logout</a>
        </div>
    </div>
    <div id="graph"></div>
    <script>
        const nodes = new vis.DataSet({{ nodes|tojson }});
        const links = new vis.DataSet({{ links|tojson }});
        const container = document.getElementById('graph');
        const data = { nodes: nodes, edges: links };
        const options = {
            nodes: { shape: 'dot', size: 20, font: { color: '#fff' } },
            edges: { color: { color: '#00d9ff', highlight: '#00ffff' } },
            physics: { enabled: true },
            interaction: { hover: true }
        };
        new vis.Network(container, data, options);
    </script>
</body>
</html>
