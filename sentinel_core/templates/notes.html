<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Sentinel Core</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #1e293b; padding: 1.5rem; border-right: 1px solid #334155; position: fixed; height: 100vh; overflow-y: auto; }
        .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
        .logo i { font-size: 1.5rem; color: #3b82f6; }
        .logo span { font-weight: 700; font-size: 1.2rem; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1rem; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 0.5rem; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .nav-item i { width: 20px; text-align: center; }
        .main-content { margin-left: 260px; flex: 1; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.8rem; font-weight: 700; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .note-card { background: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; cursor: pointer; transition: all 0.2s; }
        .note-card:hover { transform: translateY(-4px); border-color: #3b82f6; }
        .note-card h3 { margin-bottom: 0.5rem; }
        .note-card p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.5; }
        .note-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: #64748b; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 600px; border: 1px solid #334155; }
        .modal-content h2 { margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #94a3b8; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.875rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; }
        .form-group textarea { min-height: 200px; resize: vertical; }
        .ai-suggestion { background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1)); padding: 1rem; border-radius: 8px; margin-top: 1rem; border: 1px solid rgba(59, 130, 246, 0.3); }
        .ai-suggestion strong { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-halved"></i><span>Sentinel Core</span></div>
        <a href="/" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
        <a href="/cases" class="nav-item"><i class="fas fa-folder-open"></i> Cases</a>
        <a href="/notes" class="nav-item active"><i class="fas fa-sticky-note"></i> Notes</a>
        <a href="/reports" class="nav-item"><i class="fas fa-file-alt"></i> Reports</a>
        <a href="/terminal" class="nav-item"><i class="fas fa-terminal"></i> Terminal</a>
        <a href="/settings" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #334155;">
            <a href="/logout" class="nav-item"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>
    <div class="main-content">
        <div class="header">
            <h1><i class="fas fa-sticky-note"></i> Notes</h1>
            <button onclick="openModal()" class="btn btn-primary"><i class="fas fa-plus"></i> New Note</button>
        </div>
        <div class="notes-grid">
            {% for note in notes %}
            <div class="note-card">
                <h3>{{ note[1] }}</h3>
                <p>{{ note[2][:150] }}{% if note[2]|length > 150 %}...{% endif %}</p>
                <div class="note-meta">
                    <span>{{ note[3] }}</span>
                    <span>{{ note[4][:10] }}</span>
                </div>
                <div class="ai-suggestion" style="margin-top:1rem;" onclick="analyzeNote('{{ note[2][:100] }}')">
                    <strong><i class="fas fa-robot"></i> Ask Kimi:</strong> Analyze this note
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div id="noteModal" class="modal">
        <div class="modal-content">
            <h2>Create Note</h2>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="noteTitle" placeholder="Note title">
            </div>
            <div class="form-group">
                <label>Content</label>
                <textarea id="noteContent" placeholder="Write your note here... I found X vulnerability in target Y..."></textarea>
            </div>
            <div class="form-group">
                <label>Tags (comma-separated)</label>
                <input type="text" id="noteTags" placeholder="recon, vulnerability, web">
            </div>
            <div id="aiSuggestion" class="ai-suggestion" style="display:none;"></div>
            <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1.5rem;">
                <button onclick="closeModal()" class="btn btn-secondary" style="background:#334155;color:#e2e8f0;">Cancel</button>
                <button onclick="saveNote()" class="btn btn-primary">Save Note</button>
            </div>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('noteModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('noteModal').style.display = 'none'; }

        async function saveNote() {
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;
            const tags = document.getElementById('noteTags').value;
            
            const res = await fetch('/api/create_note', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title, content, tags})
            });
            
            if (res.ok) location.reload();
        }

        async function analyzeNote(content) {
            const suggestionBox = document.getElementById('aiSuggestion');
            suggestionBox.style.display = 'block';
            suggestionBox.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Kimi is analyzing...';
            
            const res = await fetch('/api/ask_kimi', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: `I found: ${content}. What should I do next? Give me actionable steps.`, role: 'Ethical Hacker'})
            });
            const data = await res.json();
            
            if (data.response) {
                suggestionBox.innerHTML = `<strong><i class="fas fa-robot"></i> Kimi AI Suggests:</strong><br>${data.response.replace(/\n/g, '<br>')}`;
            }
        }
    </script>
</body>
</html>
