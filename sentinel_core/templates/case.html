<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Core - Case: {{ case[2] }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        :root {
            --primary-bg: #1a1a2e;
            --secondary-bg: #16213e;
            --accent: #0f3460;
            --text-light: #e8e8e8;
        }
        body {
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            min-height: 100vh;
            color: var(--text-light);
        }
        .navbar {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
        }
        .graph-container {
            height: 600px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .module-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .module-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }
        .btn-primary {
            background: #e94560;
            border: none;
        }
        .entity-panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
            <div class="navbar-nav ms-auto">
                <span class="nav-item nav-link text-light">
                    Case: {{ case[2] }}
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Left Panel: Modules -->
            <div class="col-md-3">
                <div class="entity-panel mb-4">
                    <h4><i class="fas fa-microchip me-2"></i>OSINT Modules</h4>
                    <p class="text-muted small">Click to run module on target</p>
                    <div id="modulesList" class="list-group">
                        <!-- Modules loaded via JS -->
                    </div>
                    
                    <hr class="my-4">
                    
                    <h5><i class="fas fa-plus-circle me-2"></i>Add Entity</h5>
                    <form id="addEntityForm">
                        <input type="hidden" id="caseId" value="{{ case[0] }}">
                        <div class="mb-2">
                            <select class="form-select form-select-sm" id="entityType">
                                <option value="domain">Domain</option>
                                <option value="ip">IP Address</option>
                                <option value="email">Email</option>
                                <option value="person">Person</option>
                                <option value="organization">Organization</option>
                                <option value="url">URL</option>
                                <option value="phone">Phone</option>
                                <option value="social">Social Media</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <input type="text" class="form-control form-control-sm" id="entityValue" placeholder="Value" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">
                            <i class="fas fa-plus me-1"></i>Add Entity
                        </button>
                    </form>
                </div>
            </div>

            <!-- Center: Graph Visualization -->
            <div class="col-md-6">
                <div class="graph-container" id="cy"></div>
                
                <div class="mt-3 d-flex justify-content-between">
                    <div>
                        <button class="btn btn-outline-light btn-sm" onclick="autoLayout()">
                            <i class="fas fa-sitemap me-1"></i>Auto Layout
                        </button>
                        <button class="btn btn-outline-light btn-sm" onclick="clearGraph()">
                            <i class="fas fa-trash me-1"></i>Clear
                        </button>
                    </div>
                    <div>
                        <span class="badge bg-info">Entities: <span id="entityCount">0</span></span>
                        <span class="badge bg-warning">Relationships: <span id="relCount">0</span></span>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Entity Details & Relationships -->
            <div class="col-md-3">
                <div class="entity-panel">
                    <h4><i class="fas fa-link me-2"></i>Relationships</h4>
                    <form id="addRelationshipForm" class="mb-4">
                        <div class="mb-2">
                            <label class="small">Source Entity ID</label>
                            <input type="number" class="form-control form-control-sm" id="sourceId" required>
                        </div>
                        <div class="mb-2">
                            <label class="small">Target Entity ID</label>
                            <input type="number" class="form-control form-control-sm" id="targetId" required>
                        </div>
                        <div class="mb-2">
                            <label class="small">Relationship Type</label>
                            <select class="form-select form-select-sm" id="relType">
                                <option value="owns">Owns</option>
                                <option value="resolves_to">Resolves To</option>
                                <option value="hosted_on">Hosted On</option>
                                <option value="registered_to">Registered To</option>
                                <option value="associated_with">Associated With</option>
                                <option value="linked_to">Linked To</option>
                                <option value="member_of">Member Of</option>
                                <option value="contact_for">Contact For</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">
                            <i class="fas fa-link me-1"></i>Create Link
                        </button>
                    </form>
                    
                    <hr>
                    
                    <h5><i class="fas fa-database me-2"></i>Entities</h5>
                    <div id="entitiesList" class="small">
                        <!-- Entities list -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Module Execution Modal -->
    <div class="modal fade" id="moduleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="background: var(--secondary-bg); color: var(--text-light);">
                <div class="modal-header">
                    <h5 class="modal-title" id="moduleTitle">Run Module</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="selectedModule">
                    <div class="mb-3">
                        <label class="form-label">Target</label>
                        <input type="text" class="form-control" id="moduleTarget" placeholder="e.g., example.com">
                    </div>
                    <div id="moduleResult" class="alert alert-info d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="executeModule()">
                        <i class="fas fa-play me-2"></i>Run
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const caseId = {{ case[0] }};
        let cy;
        let entities = {{ entities | tojson }};
        let relationships = {{ relationships | tojson }};

        // Initialize Cytoscape
        document.addEventListener('DOMContentLoaded', function() {
            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: {
                    nodes: entities.map(e => ({
                        data: { id: e[0], label: e[3], type: e[2] }
                    })),
                    edges: relationships.map(r => ({
                        data: { id: r[0], source: r[2], target: r[3], label: r[4] }
                    }))
                },
                style: [
                    {
                        selector: 'node',
                        style: {
                            'background-color': '#e94560',
                            'label': 'data(label)',
                            'color': '#fff',
                            'text-valign': 'center',
                            'text-halign': 'center',
                            'width': '60px',
                            'height': '60px',
                            'font-size': '12px'
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#0f3460',
                            'target-arrow-color': '#0f3460',
                            'target-arrow-shape': 'triangle',
                            'label': 'data(label)',
                            'curve-style': 'bezier',
                            'font-size': '10px',
                            'color': '#aaa'
                        }
                    },
                    {
                        selector: 'node[type="domain"]',
                        style: { 'background-color': '#4ecca3' }
                    },
                    {
                        selector: 'node[type="ip"]',
                        style: { 'background-color': '#ffd369' }
                    },
                    {
                        selector: 'node[type="email"]',
                        style: { 'background-color': '#ff6b6b' }
                    },
                    {
                        selector: 'node[type="person"]',
                        style: { 'background-color': '#a8d8ea' }
                    }
                ],
                layout: {
                    name: 'grid',
                    rows: 1
                }
            });

            updateCounts();
            loadModules();
            renderEntitiesList();
        });

        function loadModules() {
            fetch('/api/modules')
                .then(response => response.json())
                .then(modules => {
                    const container = document.getElementById('modulesList');
                    container.innerHTML = modules.map(m => `
                        <button class="list-group-item list-group-item-action module-card" 
                                onclick="openModuleModal('${m.id}', '${m.name}')"
                                style="background: transparent; color: #e8e8e8; border: 1px solid rgba(255,255,255,0.1);">
                            <i class="fas fa-cog me-2"></i>${m.name}
                            <small class="d-block text-muted">${m.description}</small>
                        </button>
                    `).join('');
                });
        }

        function openModuleModal(moduleId, moduleName) {
            document.getElementById('selectedModule').value = moduleId;
            document.getElementById('moduleTitle').textContent = `Run: ${moduleName}`;
            new bootstrap.Modal(document.getElementById('moduleModal')).show();
        }

        function executeModule() {
            const moduleId = document.getElementById('selectedModule').value;
            const target = document.getElementById('moduleTarget').value;
            
            if (!target) {
                alert('Please enter a target');
                return;
            }

            const formData = new FormData();
            formData.append('module_id', moduleId);
            formData.append('target', target);
            formData.append('case_id', caseId);

            fetch('/api/module/run', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('moduleResult');
                resultDiv.classList.remove('d-none');
                resultDiv.textContent = JSON.stringify(data.data, null, 2);
                
                // Add result as entity
                addEntityToGraph('scan_result', `${moduleId}: ${target}`);
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        function addEntityToGraph(type, value) {
            const formData = new FormData();
            formData.append('case_id', caseId);
            formData.append('entity_type', type);
            formData.append('value', value);

            fetch('/api/entity/add', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    cy.add({
                        group: 'nodes',
                        data: { id: data.entity_id, label: value, type: type }
                    });
                    updateCounts();
                    renderEntitiesList();
                }
            });
        }

        document.getElementById('addEntityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('entityType').value;
            const value = document.getElementById('entityValue').value;
            addEntityToGraph(type, value);
            document.getElementById('entityValue').value = '';
        });

        document.getElementById('addRelationshipForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const sourceId = document.getElementById('sourceId').value;
            const targetId = document.getElementById('targetId').value;
            const relType = document.getElementById('relType').value;

            const formData = new FormData();
            formData.append('case_id', caseId);
            formData.append('source_id', sourceId);
            formData.append('target_id', targetId);
            formData.append('relationship_type', relType);

            fetch('/api/relationship/add', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    cy.add({
                        group: 'edges',
                        data: { source: sourceId, target: targetId, label: relType }
                    });
                    updateCounts();
                }
            });
        });

        function autoLayout() {
            cy.layout({ name: 'cose', animate: true }).run();
        }

        function clearGraph() {
            if (confirm('Clear all entities and relationships?')) {
                cy.elements().remove();
                entities = [];
                relationships = [];
                updateCounts();
                renderEntitiesList();
            }
        }

        function updateCounts() {
            document.getElementById('entityCount').textContent = cy.nodes().length;
            document.getElementById('relCount').textContent = cy.edges().length;
        }

        function renderEntitiesList() {
            const list = document.getElementById('entitiesList');
            const nodes = cy.nodes();
            list.innerHTML = nodes.map(n => `
                <div class="p-2 mb-1" style="background: rgba(255,255,255,0.05); border-radius: 5px;">
                    <strong>ID:</strong> ${n.id()} | 
                    <strong>${n.data('type')}</strong>: ${n.data('label')}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
