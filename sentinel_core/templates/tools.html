<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tools - Sentinel Core</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f23; color: #fff; min-height: 100vh; }
        .navbar { background: rgba(0,0,0,0.5); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,217,255,0.2); }
        .navbar h1 { color: #00d9ff; font-size: 24px; }
        .nav-links a { color: #888; text-decoration: none; margin-left: 20px; }
        .nav-links a:hover { color: #00d9ff; }
        .container { padding: 30px; }
        .section { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .section h3 { color: #00d9ff; margin-bottom: 15px; }
        .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .tool-card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .tool-card h4 { color: #00d9ff; font-size: 14px; margin-bottom: 5px; }
        .tool-card p { color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🛡️ Sentinel Core</h1>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('cases_list') }}">Cases</a>
            <a href="{{ url_for('tools_list') }}" style="color: #00d9ff;">Tools</a>
            <a href="{{ url_for('logout') }}" style="color: #ff4444;">Logout</a>
        </div>
    </div>
    <div class="container">
        <h2 style="color: #00d9ff; margin-bottom: 20px;">🔧 Available Tools</h2>
        {% for category, tools in categories.items() %}
        <div class="section">
            <h3>{{ category|upper }}</h3>
            <div class="tool-grid">
                {% for tool in tools %}
                <div class="tool-card"><h4>{{ tool }}</h4><p>Click to use in a case</p></div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
