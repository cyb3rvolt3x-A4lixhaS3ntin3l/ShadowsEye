{% extends "base.html" %}

{% block title %}New Case - Sentinel Core{% endblock %}
{% block header_title %}Create New Case{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-folder-plus"></i> Create New Case</h3>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('case_new') }}">
            <div class="form-group">
                <label for="title">Case Title *</label>
                <input type="text" class="form-control" id="title" name="title" required 
                       placeholder="e.g., Phishing Campaign Investigation">
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="5"
                          placeholder="Provide details about the case..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="priority">Priority</label>
                <select class="form-control" id="priority" name="priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Create Case
                </button>
                <a href="{{ url_for('cases') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
