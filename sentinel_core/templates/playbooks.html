<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Playbooks - Sentinel Core</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f23; color: #fff; min-height: 100vh; }
        .navbar { background: rgba(0,0,0,0.5); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,217,255,0.2); }
        .navbar h1 { color: #00d9ff; font-size: 24px; }
        .nav-links a { color: #888; text-decoration: none; margin-left: 20px; }
        .nav-links a:hover { color: #00d9ff; }
        .container { padding: 30px; }
        .section { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .section h3 { color: #00d9ff; margin-bottom: 10px; }
        .section p { color: #888; margin-bottom: 15px; }
        .btn { padding: 8px 16px; border-radius: 6px; text-decoration: none; display: inline-block; border: none; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #00d9ff, #0099cc); color: #fff; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🛡️ Sentinel Core</h1>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('cases_list') }}">Cases</a>
            <a href="{{ url_for('playbooks_list') }}" style="color: #00d9ff;">Playbooks</a>
            <a href="{{ url_for('logout') }}" style="color: #ff4444;">Logout</a>
        </div>
    </div>
    <div class="container">
        <h2 style="color: #00d9ff; margin-bottom: 20px;">📜 Automated Playbooks</h2>
        {% for playbook in playbooks %}
        <div class="section">
            <h3>{{ playbook.name }}</h3>
            <p>{{ playbook.description }}</p>
            <small style="color: #666;">Category: {{ playbook.category }} | Steps: {{ playbook.steps|length }}</small>
        </div>
        {% endfor %}
    </div>
</body>
</html>
