[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowseye"
version = "0.1.0"
description = "Authorized reconnaissance inventory CLI for scoped/lab assets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "ShadowsEye contributors" }]
keywords = ["osint", "recon", "dns", "authorized", "inventory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.31.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
shadowseye = "shadowseye:cli"

[project.urls]
Homepage = "https://github.com/cyb3rvolt3x-A4lixhaS3ntin3l/ShadowsEye"
Repository = "https://github.com/cyb3rvolt3x-A4lixhaS3ntin3l/ShadowsEye"

[tool.setuptools]
py-modules = ["shadowseye"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
